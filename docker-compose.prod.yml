services:
  backend:
    image: ghcr.io/todor-kirichev/quotes-backend:latest
    restart: unless-stopped

  frontend:
    image: ghcr.io/todor-kirichev/quotes-frontend:latest
    depends_on:
      - backend
    restart: unless-stopped
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped 
    